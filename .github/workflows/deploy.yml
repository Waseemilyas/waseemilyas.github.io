name: Build & deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions: {}
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Privacy guard on the source being published
        run: node scripts/content-guard.mjs
      # This build is consumed by Pages, rather than repeating the PR test suite.
      - name: Build the production artifact and validate its contracts
        run: pnpm build && node scripts/site-check.mjs
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SITE_REVISION: ${{ github.sha }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          retention-days: 1
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Verify the exact revision from production
        run: >-
          node scripts/verify-deploy.mjs
          --url https://waseemilyas.uk/revision.txt
          --revision "${SITE_REVISION}"
          --attempts 8 --backoff-ms 3000 --timeout-ms 10000
        env:
          SITE_REVISION: ${{ github.sha }}
