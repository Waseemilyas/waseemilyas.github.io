# Build the Eleventy site and deploy it to GitHub Pages.
# Deployment is UNGATED: the site is public by design and agent-maintained, so a
# push to main publishes. The pre-launch manual-only gate retired when the site
# went live.
# The content rules that replace that gate live in AGENTS.md.
name: Build & deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # pnpm 11 (pinned in package.json packageManager) needs Node >= 22.13.
          # Node 20 here silently broke the deploy from the pnpm migration until
          # push-triggered deploys surfaced it.
          node-version: 22
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
        env:
          # Public browser DSN; kept in Actions so non-production builds do not
          # emit a monitoring loader.
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
