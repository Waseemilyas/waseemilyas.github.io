# Build the Eleventy site and deploy it to GitHub Pages.
# Deployment is UNGATED: the site is public by design and agent-maintained, so a
# push to main publishes (Waseem, 2026-07-29, AUT-3857). The pre-launch
# manual-only gate (AUT-414) retired when the site went live (AUT-416).
# The content rules that replace that gate live in AGENTS.md.
name: Build & deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # pnpm 11 (pinned in package.json packageManager) needs Node >= 22.13.
          # Node 20 here silently broke the deploy from the pnpm migration until
          # push-triggered deploys surfaced it (AUT-3857).
          node-version: 22
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
        env:
          # Public browser DSN; kept in Actions so non-production builds do not
          # emit a monitoring loader.
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
